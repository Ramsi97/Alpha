<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <link href="../_shared/theme.css" rel="stylesheet" type="text/css">
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <style>
    .alphago-waiting {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--ag-bg);
      color: var(--ag-text);
      font-size: 18px;
    }
    .alphago-waiting.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title" data-i18n="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro" data-i18n="intro">Join the numbers and get to the 2048 tile!</p>
      <a class="restart-button" data-i18n="newGame">New Game</a>
    </div>

    <div class="game-container">
      <div class="alphago-waiting" data-i18n="waiting">Waiting for the game to start…</div>

      <div class="game-message">
        <p></p>
        <div class="lower">
	        <a class="keep-playing-button" data-i18n="keepGoing">Keep going</a>
          <a class="retry-button" data-i18n="tryAgain">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <p class="game-explanation">
      <strong class="important" data-i18n="howToPlayLabel">How to play:</strong>
      <span data-i18n="howToPlayBody">Use your arrow keys or swipe to move the tiles. When two tiles with the same number touch, they merge into one!</span>
    </p>
    <hr>
    <p>
      Based on <a href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener">2048 by Gabriele Cirulli</a> (MIT license). <a href="CREDITS.md" target="_blank" rel="noopener" data-i18n="credits">Credits</a>.
    </p>
  </div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="../_shared/alphago-bridge.js"></script>
  <script src="../_shared/i18n-helper.js"></script>
  <script src="strings.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
