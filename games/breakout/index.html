<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Breakout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="stylesheet" href="../_shared/theme.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
    }
    #hud {
      display: flex;
      gap: 16px;
      font-family: monospace;
      font-size: 15px;
      color: var(--ag-text);
    }
    #board-wrap {
      width: min(92vw, 400px);
      aspect-ratio: 3 / 4;
      position: relative;
    }
    #board {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--ag-secondary-bg);
      border-radius: 8px;
      touch-action: none;
    }
    .alphago-waiting {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--ag-bg);
      color: var(--ag-text);
      font-size: 16px;
      border-radius: 8px;
    }
    .alphago-waiting.hidden { display: none; }
    #hint {
      font-size: 13px;
      color: var(--ag-hint);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Lives: <span id="lives">3</span></span>
  </div>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div class="alphago-waiting">Waiting for the game to start…</div>
  </div>
  <p id="hint">Drag or use arrow keys to move the paddle.</p>

  <script src="../_shared/alphago-bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
